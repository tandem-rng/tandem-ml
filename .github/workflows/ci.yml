name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / OCaml ${{ matrix.ocaml }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml: ["5.5", "5.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @all @runtest
  conformance:
    name: conformance files match the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone -q https://github.com/tandem-rng/spec ../tandem-spec
          git -C ../tandem-spec checkout -q b31af7238076b414a3eb2a128bfd010cce136287
          for f in test/conformance/*.json; do cmp "$f" "../tandem-spec/conformance/$(basename "$f")"; done
